[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osai"
version = "0.1.0"
description = "osAi quantization-preserving training for MLX and GGUF language models"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{name = "osCode Project"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "certifi>=2024.8,<2027",
  "numpy>=1.26,<3",
  "pyyaml>=5.1,<7",
  "safetensors>=0.5,<1",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
gguf = []
mlx = [
  "mlx>=0.32.2,<0.33; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "mlx[cpu]>=0.32.2,<0.33; platform_system == 'Linux'",
  "mlx-lm[train]>=0.31.3,<0.32; platform_system == 'Darwin' or platform_system == 'Linux'",
  "transformers>=5.5,<5.6; platform_system == 'Darwin' or platform_system == 'Linux'",
  "Pillow>=10.3,<13; platform_system == 'Darwin' or platform_system == 'Linux'",
  "opencv-python-headless>=4.10,<5; platform_system == 'Darwin' or platform_system == 'Linux'",
  "miniaudio>=1.59,<2; platform_system == 'Darwin' or platform_system == 'Linux'",
  "mlx-audio==0.4.3; platform_system == 'Darwin' or platform_system == 'Linux'",
  "torch>=2.7,<3; platform_system == 'Darwin' or platform_system == 'Linux'",
  "torchvision>=0.22,<1; platform_system == 'Darwin' or platform_system == 'Linux'",
  "numpy>=2.0,<3; platform_system == 'Darwin' or platform_system == 'Linux'",
  "safetensors>=0.5,<1; platform_system == 'Darwin' or platform_system == 'Linux'",
]
mlx-cuda12 = [
  "mlx[cuda12]>=0.32.2,<0.33; platform_system == 'Linux'",
  "mlx-lm[train,cuda12]>=0.31.3,<0.32; platform_system == 'Linux'",
  "transformers>=5.5,<5.6; platform_system == 'Linux'",
  "Pillow>=10.3,<13; platform_system == 'Linux'",
  "opencv-python-headless>=4.10,<5; platform_system == 'Linux'",
  "miniaudio>=1.59,<2; platform_system == 'Linux'",
  "mlx-audio==0.4.3; platform_system == 'Linux'",
  "torch>=2.7,<3; platform_system == 'Linux'",
  "torchvision>=0.22,<1; platform_system == 'Linux'",
  "numpy>=2.0,<3; platform_system == 'Linux'",
  "safetensors>=0.5,<1; platform_system == 'Linux'",
]
mlx-cuda13 = [
  "mlx[cuda13]>=0.32.2,<0.33; platform_system == 'Linux'",
  "mlx-lm[train,cuda13]>=0.31.3,<0.32; platform_system == 'Linux'",
  "transformers>=5.5,<5.6; platform_system == 'Linux'",
  "Pillow>=10.3,<13; platform_system == 'Linux'",
  "opencv-python-headless>=4.10,<5; platform_system == 'Linux'",
  "miniaudio>=1.59,<2; platform_system == 'Linux'",
  "mlx-audio==0.4.3; platform_system == 'Linux'",
  "torch>=2.7,<3; platform_system == 'Linux'",
  "torchvision>=0.22,<1; platform_system == 'Linux'",
  "numpy>=2.0,<3; platform_system == 'Linux'",
  "safetensors>=0.5,<1; platform_system == 'Linux'",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
osai = "osai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
